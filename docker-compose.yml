version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: certiledger-postgres
    environment:
      POSTGRES_USER: certiledger
      POSTGRES_PASSWORD: certiledger
      POSTGRES_DB: certiledger
    ports:
      - "5432:5432"
    volumes:
      - certiledger-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U certiledger -d certiledger"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  certiledger-pgdata: